<!DOCTYPE html>
<html lang="es">
	<head>
		<meta charset="UTF-8" />
		<title>Telegram Share Extension</title>
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0"
		/>
		<link
			rel="stylesheet"
			href="options.css"
		/>
	</head>

	<body>
		<h1 id="settingsTitle"></h1>
		<div
			id="toastRegion"
			class="toast-region"
			aria-live="polite"
		></div>
		<div class="fieldset-row">
			<fieldset>
				<legend id="telegramDesktopLegend"></legend>
				<label id="telegramAliasLabel"></label>
				<input
					id="telegram_username"
					type="text"
					autocapitalize="none"
					autocorrect="off"
					spellcheck="false"
					placeholder=""
				/>
				<div class="default-method-block">
					<label id="defaultMethodLabel"></label>
					<div class="default-method-options">
						<label class="method-option">
							<input
								id="defaultMethodDesktop"
								name="default_send_method"
								type="radio"
								value="desktop"
							/>
							<span id="defaultMethodDesktopLabel"></span>
						</label>
						<label class="method-option">
							<input
								id="defaultMethodBot"
								name="default_send_method"
								type="radio"
								value="bot"
							/>
							<span id="defaultMethodBotLabel"></span>
						</label>
					</div>
					<p id="defaultMethodHint"></p>
				</div>
			</fieldset>
			<fieldset>
				<legend id="botApiLegend"></legend>
				<div>
					<label id="botTokenLabel"></label>
					<input
						id="token"
						type="password"
						autocapitalize="none"
						spellcheck="false"
						autocorrect="off"
						placeholder=""
					/>
					<div id="botPreviewContainer">
						<span
							id="botStatusBadge"
							class="status-badge"
						></span>
						<span id="botPreview"></span>
					</div>
				</div>
				<div>
					<label id="chatIdLabel"></label>
					<input
						id="chat_id"
						type="text"
						autocapitalize="none"
						autocorrect="off"
						spellcheck="false"
						placeholder=""
					/>
					<div id="chatIdPreviewContainer">
						<span
							id="chatStatusBadge"
							class="status-badge"
						></span>
						<img id="chatIdPhoto" />
						<span id="chatIdPreview"></span>
					</div>
				</div>
				<div class="test-send-block">
					<label id="testMessageLabel"></label>
					<input
						id="test_message"
						type="text"
						maxlength="280"
						placeholder=""
					/>
					<button
						id="sendTestButton"
						type="button"
					></button>
				</div>
			</fieldset>
		</div>
		<div class="action-row">
			<button
				id="saveButton"
				type="button"
			></button>
		</div>

		<script src="options.js"></script>
	</body>
</html>
